name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check the package metadata
        run: twine check --strict dist/*

      - name: Install the wheel and import it
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/bin/pip" install --disable-pip-version-check dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/consumer/bin/python" -c "import murkio, murkio.wsgi, murkio.asgi; print(murkio.Murkio)"
